# SMTP falso: os e-mails de aprovação do billing aparecem em http://$(minikube ip):31080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maildev
  namespace: zm
  labels:
    app: maildev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maildev
  template:
    metadata:
      labels:
        app: maildev
    spec:
      containers:
        - name: maildev
          image: maildev/maildev
          ports:
            - containerPort: 1025
            - containerPort: 1080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maildev
  namespace: zm
spec:
  type: NodePort
  selector:
    app: maildev
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 1080
      targetPort: 1080
      nodePort: 31080
