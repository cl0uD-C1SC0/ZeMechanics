# RabbitMQ: filas da Saga (billing.commands, execution.commands, os.events + DLQs).
# Painel: http://$(minikube ip):31672  (guest / guest)
# Sem volume: as filas são recriadas pelos serviços ao conectar (ambiente de estudo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: zm
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          # a imagem oficial já libera o guest fora do localhost (igual ao compose)
          ports:
            - containerPort: 5672
            - containerPort: 15672
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: zm
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: painel
      port: 15672
      targetPort: 15672
      nodePort: 31672
