name: CI/CD

on:
  push:
    branches:
      - feat/init_project
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mecanica
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/mecanica
      SECRET_KEY: "1234"
      SECRET_KEY_JWT: "admin123"
      USER_NAME: admin
      USER_PASSWORD: admin1234
      MAIL_SERVER_ADDRESS: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes unitários
        run: python -m pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tag da imagem (5 primeiros caracteres do commit)
        id: tag
        run: echo "image_tag=${GITHUB_SHA:0:5}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mecanica:${{ steps.tag.outputs.image_tag }} .

      - name: Push da imagem para o Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/mecanica:${{ steps.tag.outputs.image_tag }}

      - name: Atualizar a imagem no mecanica-dp.yaml
        run: |
          sed -i "s|image: \".*\"|image: \"${{ secrets.DOCKERHUB_USERNAME }}/mecanica:${{ steps.tag.outputs.image_tag }}\"|" k8s/api/mecanica-dp.yaml

      - name: Commitar o manifesto atualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza imagem da API para ${{ secrets.DOCKERHUB_USERNAME }}/mecanica:${{ steps.tag.outputs.image_tag }}"
          file_pattern: k8s/api/mecanica-dp.yaml
