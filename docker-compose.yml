# Ze Mechanics - Fase 4 (microsserviços)
#
# Bancos:
#   - Um único MySQL com um SCHEMA + USUÁRIO por serviço (ver mysql-init/01-schemas.sql).
#     Nenhum serviço consegue acessar o schema do outro (GRANT só no próprio).
#   - MongoDB (NoSQL) exclusivo do execution-service.
#
# Comunicação:
#   - os-service -> catalog-service : REST (síncrono)
#   - os-service <-> billing / execution : RabbitMQ (assíncrono, Saga orquestrada)
#
#   os-service        -> http://localhost:8000/docs
#   catalog-service   -> http://localhost:8001/docs
#   billing-service   -> http://localhost:8002/docs
#   execution-service -> http://localhost:8003/docs
#   rabbitmq (painel) -> http://localhost:15672  (guest / guest)
#   maildev           -> http://localhost:1080

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F

services:

  # ── INFRA ──────────────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # volume com nome próprio: não reaproveita o "mysql_data" do monólito (Fase 3)
      - mysql_fase4_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # via TCP com um usuário de serviço: só passa depois que o init.sql terminou
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-ucatalog_user", "-pcatalog_pass", "-e", "SELECT 1"]
      start_period: 30s
      interval: 5s
      retries: 30

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_fase4_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  maildev:
    image: maildev/maildev
    container_name: maildev
    restart: always
    ports:
      - "1025:1025"
      - "1080:1080"

  # ── MICROSSERVIÇOS ─────────────────────────────────────────

  os-service:
    build: ./os-service
    container_name: os_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      <<: *rabbitmq-env
      DATABASE_URL: mysql+pymysql://os_user:os_pass@mysql:3306/os_db
      CATALOG_SERVICE_URL: http://catalog-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_started

  catalog-service:
    build: ./catalog-service
    container_name: catalog_service
    restart: always
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: mysql+pymysql://catalog_user:catalog_pass@mysql:3306/catalog_db
    depends_on:
      mysql:
        condition: service_healthy

  billing-service:
    build: ./billing-service
    container_name: billing_service
    restart: always
    ports:
      - "8002:8000"
    environment:
      <<: *rabbitmq-env
      DATABASE_URL: mysql+pymysql://billing_user:billing_pass@mysql:3306/billing_db
      MAIL_SERVER_ADDRESS: maildev
      BILLING_PUBLIC_URL: http://localhost:8002
      # approved | rejected  ->  MOCK_PAGAMENTO_STATUS=rejected docker compose up -d billing-service
      MOCK_PAGAMENTO_STATUS: ${MOCK_PAGAMENTO_STATUS:-approved}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  execution-service:
    build: ./execution-service
    container_name: execution_service
    restart: always
    ports:
      - "8003:8000"
    environment:
      <<: *rabbitmq-env
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: execution_db
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_fase4_data:
  mongo_fase4_data:
