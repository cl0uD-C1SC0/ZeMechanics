version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mecanica_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mecanica
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # api:
