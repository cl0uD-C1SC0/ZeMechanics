apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: zemechanics
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  MYSQL_DATABASE: "mecanica"
  # Por padrão a imagem do MySQL só libera o root pra conexões vindas de
  # "localhost" — como a API roda num pod separado (IP diferente na rede
  # do cluster), precisa liberar explicitamente pra qualquer host.
  MYSQL_ROOT_HOST: "%"
